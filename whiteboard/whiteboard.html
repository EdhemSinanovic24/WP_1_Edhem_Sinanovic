<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Povezano sa wb-style.css kako je na tvojoj slici -->
    <link rel="stylesheet" href="wb-style.css">
    <title>Interaktivni Whiteboard</title>
</head>
<body>

    <h1>Interaktivni Whiteboard</h1>

    <!-- Alatna traka sa kontrolama -->
    <div class="toolbar">
        <label for="colorPicker">Boja: </label>
        <input type="color" id="colorPicker" value="#000000">

        <label for="brushSize">Četka: </label>
        <input type="range" id="brushSize" min="1" max="20" value="3">

        <button id="eraserBtn">Briši</button>
        <button id="clearBtn">Čista ploča</button>
        <button id="saveBtn">Snimi</button>
    </div>

    <!-- Prostor za crtanje -->
    <canvas id="board" width="900" height="500"></canvas>

    <footer>
        Web programiranje 2025/2026<br>
        Internacionalna poslovno-informaciona akademija Tuzla
    </footer>

    <!-- Povezano sa wb-script.js kako je na tvojoj slici -->
    <script src="wb-script.js"></script>
</body>
</html>
